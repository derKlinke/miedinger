# format-configs
repos:
    - repo: local
      hooks:
          - id: gitleaks
            name: gitleaks
            entry: gitleaks git --staged --no-banner --redact
            language: system
            pass_filenames: false
            priority: 10
          - id: prettier
            name: prettier
            entry: npx --yes prettier --log-level error --config configs/.prettierrc.json --ignore-path configs/.prettierignore --write
            language: system
            files: \.(js|jsx|ts|tsx|json|jsonc|yaml|yml|css|scss|html|vue|svelte|astro|md|mdx)$
            exclude: ^\.pre-commit-config\.ya?ml$
            priority: 0
